plugins { id 'com.android.application' }

def version = new Properties()
rootProject.file('version.properties').withInputStream { version.load(it) }

android {
    namespace 'com.paperkite.books'
    compileSdk 34
    defaultConfig {
        applicationId 'com.paperkite.books'
        minSdk 26
        targetSdk 34
        versionCode version.getProperty('VERSION_CODE') as int
        versionName version.getProperty('VERSION_NAME')
    }
    signingConfigs {
        // Every release must use this same key. Android only accepts an update with a matching signature.
        fixed {
            storeFile file('keystore/paperkite.jks')
            storePassword 'paperkite'
            keyAlias 'paperkite'
            keyPassword 'paperkite'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
