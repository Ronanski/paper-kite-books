name: Release APK
# Runs when a version tag such as v0.1.0-beta.1 is pushed.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches version.properties
        run: |
          name=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)
          test "v$name" = "$GITHUB_REF_NAME"
          echo "APP_VERSION=$name" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: python3 tools/build_assets.py
      - run: gradle :app:assembleDebug --no-daemon
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="PaperKiteBooks-v${APP_VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          awk -v v="[$APP_VERSION]" 'index($0,"## " v)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          flag=""; case "$APP_VERSION" in *-*) flag="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" --title "Paper Kite Books v$APP_VERSION" --notes-file notes.md --verify-tag $flag
