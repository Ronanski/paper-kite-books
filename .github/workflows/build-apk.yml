name: Release APK
# Runs when version.properties changes on main, and can also be started by hand.
# It reads the version, then creates the matching tag and release.
on:
  push:
    branches: [main]
    paths: [version.properties]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        run: |
          test "$GITHUB_REF_NAME" = main
          name=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)
          code=$(grep '^VERSION_CODE=' version.properties | cut -d= -f2)
          echo "APP_VERSION=$name" >> "$GITHUB_ENV"
          echo "APP_BUILD=$code" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Get the open-license fonts
        continue-on-error: true
        run: |
          d=app/src/main/assets/fonts; mkdir -p $d
          b=https://github.com/google/fonts/raw/main/ofl
          curl -fsSL -o $d/Grandstander.ttf "$b/grandstander/Grandstander%5Bwght%5D.ttf"
          curl -fsSL -o $d/Andika-Regular.ttf "$b/andika/Andika-Regular.ttf"
          curl -fsSL -o $d/Andika-Bold.ttf "$b/andika/Andika-Bold.ttf"
          curl -fsSL -o $d/Grandstander-OFL.txt "$b/grandstander/OFL.txt"
          curl -fsSL -o $d/Andika-OFL.txt "$b/andika/OFL.txt"
      - run: python3 tools/build_assets.py
      - run: gradle :app:assembleDebug --no-daemon
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="PaperKiteBooks-v${APP_VERSION}-build${APP_BUILD}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          awk -v v="[$APP_VERSION]" 'index($0,"## " v)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          flag=""; case "$APP_VERSION" in *-*) flag="--prerelease";; esac
          gh release create "v$APP_VERSION" "$apk" "$apk.sha256" --target "$GITHUB_SHA" --title "Paper Kite Books v$APP_VERSION" --notes-file notes.md $flag
