name: Release APK
# Started by hand: Actions tab > Release APK > Run workflow.
# It reads version.properties, then creates the matching tag and release.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        run: |
          test "$GITHUB_REF_NAME" = main
          name=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)
          echo "APP_VERSION=$name" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: python3 tools/build_assets.py
      - run: gradle :app:assembleDebug --no-daemon
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="PaperKiteBooks-v${APP_VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          awk -v v="[$APP_VERSION]" 'index($0,"## " v)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          flag=""; case "$APP_VERSION" in *-*) flag="--prerelease";; esac
          gh release create "v$APP_VERSION" "$apk" "$apk.sha256" --target "$GITHUB_SHA" --title "Paper Kite Books v$APP_VERSION" --notes-file notes.md $flag
